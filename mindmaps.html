<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CGMH OPH — Mind Maps</title>
<style>
  :root{ --bg:#0e1420; --ink:#e9eef7; --muted:#93a3c0; --line:#33425f; --panel:#141d2e; --accent:#5aa7ff; --side:280px; --bar-h:56px; }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:radial-gradient(1200px 800px at 60% 42%,#131b2c,#0e1420 70%);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}

  #bar{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
       padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
  #crumb{font-size:14px;font-weight:700;max-width:min(42vw,560px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #crumb small{color:var(--muted);font-weight:400}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:0;border-radius:0;background:var(--panel)}
  .seg button.on{background:var(--accent);color:var(--on-accent);font-weight:700}
  button{background:var(--panel);color:var(--ink);border:1px solid var(--line);padding:6px 11px;border-radius:7px;font-size:13px;cursor:pointer}
  button:hover{filter:brightness(1.15)}
  .tool-link{display:none;background:var(--panel);color:var(--ink);border:1px solid var(--line);padding:6px 11px;
             border-radius:7px;font-size:13px;text-decoration:none}
  .tool-link:hover{filter:brightness(1.15);border-color:var(--accent)}
  .theme-dots{display:inline-flex;gap:8px;align-items:center;padding:0 2px}
  .tdot{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid rgba(128,128,128,.5);position:relative}
  .tdot:hover{transform:scale(1.12)}
  .tdot.sel{outline:2px solid var(--ink);outline-offset:2px}
  /* sidebar */
  #sidebar{position:fixed;top:var(--bar-h);left:0;bottom:0;width:var(--side);z-index:25;overflow:auto;
           background:var(--panel);border-right:1px solid var(--line);padding:6px 5px 40px;box-shadow:4px 0 18px rgba(0,0,0,.08)}
  #sidebar{transition:width .22s,padding .22s}
  .toolbox-search-wrap{position:sticky;top:-6px;z-index:4;display:flex;gap:5px;padding:6px 2px 8px;background:var(--panel)}
  .toolbox-search{min-width:0;flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:12px;outline:none}
  .toolbox-search:focus{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 20%,transparent)}
  .toolbox-search::placeholder{color:var(--muted)}
  .toolbox-search-clear{display:none;flex:0 0 auto;padding:6px 9px;color:var(--muted)}
  .toolbox-search-wrap.has-query .toolbox-search-clear{display:block}
  .toolbox-no-results{display:none;padding:22px 12px;text-align:center;color:var(--muted);font-size:13px}
  .cat{margin-bottom:2px}
  .cat>.chead{display:flex;align-items:center;gap:5px;padding:5px 7px;border-radius:7px;cursor:pointer;
        font-size:11px;letter-spacing:.2px;text-transform:uppercase;color:var(--muted);font-weight:700;user-select:none}
  .cat>.chead:hover{background:rgba(255,255,255,.04);color:var(--ink)}
  .cat.current-cat>.chead{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
  .cat>.chead .car{transition:transform .15s;font-size:10px}
  .cat.collapsed>.chead .car{transform:rotate(-90deg)}
  .cat>.chead .cn{margin-left:auto;font-size:10px;background:rgba(255,255,255,.08);border-radius:9px;padding:1px 6px;color:var(--muted)}
  .cat .cbody{padding:1px 0 5px 4px}
  .cat.collapsed .cbody{display:none}
  .mapbtn{display:block;width:100%;text-align:left;padding:5px 7px;border-radius:6px;font-size:12px;line-height:1.2;
          white-space:normal;overflow:visible;background:rgba(255,255,255,.025);border:1px solid transparent;color:var(--ink)}
  .mapbtn:hover{background:rgba(255,255,255,.07);border-color:var(--accent)}
  .mapbtn.active{position:relative;padding-right:57px;background:color-mix(in srgb,var(--accent) 12%,var(--panel));border-color:var(--accent);color:var(--accent);font-weight:700;box-shadow:inset 3px 0 0 var(--accent),0 0 0 1px color-mix(in srgb,var(--accent) 18%,transparent)}
  .mapbtn.active::after{content:"Current";position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:2px 5px;border-radius:8px;background:var(--accent);color:var(--on-accent);font-size:8.5px;font-weight:800;letter-spacing:.2px;text-transform:uppercase}
  .mapbtn b{display:inline;font-weight:550}
  .empty{padding:5px 10px;color:#5b6a86;font-size:12px;font-style:italic;grid-column:1/-1}

  /* floating toolbox expand control */
  #drawerToggle{position:fixed;top:calc(var(--bar-h) + 12px);left:calc(var(--side) - 1px);z-index:60;width:27px;height:44px;
        padding:0;border-left:0;border-radius:0 10px 10px 0;background:var(--panel);color:var(--muted);
        box-shadow:4px 2px 12px rgba(0,0,0,.18);font-size:12px;transition:left .2s,top .2s}
  #drawerToggle:hover{color:var(--accent);border-color:var(--accent)}
  body.toolbox-expanded #drawerToggle{left:auto;right:0;border-left:1px solid var(--line);border-right:0;border-radius:10px 0 0 10px}

  /* full-page toolbox: categories stay grouped; individual maps become cards */
  body.toolbox-expanded #sidebar{right:0;width:auto;z-index:55;padding:18px 42px 70px;border-right:0;box-shadow:none}
  body.toolbox-expanded #sidebar .toolbox-search-wrap{top:-18px;margin:0 -4px 16px;padding:14px 4px 10px}
  body.toolbox-expanded #sidebar .toolbox-search{padding:12px 14px;border-radius:10px;font-size:14px}
  body.toolbox-expanded #sidebar .toolbox-search-clear{padding:9px 13px;font-size:14px}
  body.toolbox-expanded #sidebar .cat{margin:0 0 14px;border:1px solid var(--line);border-radius:12px;padding:6px;background:color-mix(in srgb,var(--panel) 92%,var(--accent))}
  body.toolbox-expanded #sidebar .chead{padding:8px 10px;font-size:12px;color:var(--ink)}
  body.toolbox-expanded #sidebar .cbody{padding:2px 6px 8px}
  body.toolbox-expanded #sidebar .cbody-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
  body.toolbox-expanded #sidebar .mapbtn{min-height:48px;padding:9px 11px;white-space:normal;background:var(--bg);border-color:var(--line);font-size:13px}
  body.toolbox-expanded #sidebar .mapbtn.active{padding-right:72px;background:color-mix(in srgb,var(--accent) 13%,var(--bg));border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent),0 0 0 2px color-mix(in srgb,var(--accent) 22%,transparent)}
  body.toolbox-expanded #sidebar .mapbtn.active::after{right:9px;padding:3px 7px;font-size:9px}
  body.toolbox-expanded #sidebar .mapbtn:hover{border-color:var(--accent);transform:translateY(-1px)}
  body.toolbox-expanded #viewtoggles{visibility:hidden}

  /* viewer areas shift right of sidebar */
  #stage{position:fixed;top:var(--bar-h);left:var(--side);right:0;bottom:0;cursor:grab;touch-action:none;transition:left .2s,top .15s}
  #stage.panning{cursor:grabbing}
  #viewport{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  svg#links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
  svg#links path{fill:none;stroke-width:2}
  .node{position:absolute;transform:translate(-50%,-50%);width:190px;padding:8px 12px;border-radius:11px;
        font-size:13px;line-height:1.32;border:1.5px solid;cursor:grab;user-select:none;
        box-shadow:0 3px 12px rgba(0,0,0,.4);transition:left .34s cubic-bezier(.4,0,.2,1),top .34s cubic-bezier(.4,0,.2,1)}
  .node.notrans{transition:none}
  .node:hover{filter:brightness(1.1)}
  .node.dragging{cursor:grabbing;z-index:6;transition:none}
  .node .row{display:flex;align-items:flex-start;gap:8px}
  .node.side-l .row{flex-direction:row-reverse}
  .node .txt{flex:1}
  .node.side-r{text-align:left}.node.side-l{text-align:right}
  .node .badge{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;margin-top:1px;
        padding:0 6px;border-radius:10px;font-size:11px;font-weight:700;background:rgba(255,255,255,.16)}
  .node.root{width:210px;font-size:15px;font-weight:700;text-align:center;background:var(--accent);border-color:rgba(128,128,128,.5);color:var(--on-accent);
        box-shadow:0 4px 18px rgba(0,0,0,.28)}
  .node.root .row{justify-content:center}
  .node.dim{opacity:.14}.node.hit{outline:2px solid #ffcf5a;outline-offset:2px}
  mark{background:#3a2a00;color:#ffe4a3;border:1px solid #e0a83a;border-radius:3px;padding:0 2px}

  #list{position:fixed;top:var(--bar-h);left:var(--side);right:0;bottom:0;overflow:auto;padding:18px 22px 80px;display:none;transition:left .2s,top .15s}
  #list ul{list-style:none;margin:0;padding-left:22px}
  #list #listRoot{padding-left:0;max-width:900px;margin:0 auto}
  #list li{position:relative;margin:2px 0}
  #list li::before{content:"";position:absolute;left:-11px;top:0;bottom:0;border-left:2px solid color-mix(in srgb,var(--accent) 42%,var(--line))}
  #list li:last-child::before{bottom:auto;height:15px}
  #list li::after{content:"";position:absolute;left:-11px;top:14px;width:10px;border-top:2px solid color-mix(in srgb,var(--accent) 42%,var(--line))}
  #list #listRoot>li::before,#list #listRoot>li::after{display:none}
  #list .lrow{display:flex;align-items:flex-start;gap:8px;padding:3px 6px;border-radius:6px}
  #list .lrow:hover{background:rgba(255,255,255,.03)}
  #list .ltog{flex:0 0 auto;width:18px;height:18px;margin-top:2px;border-radius:4px;display:flex;align-items:center;
        justify-content:center;font-size:11px;background:var(--panel);border:1px solid var(--line);color:var(--muted);cursor:pointer}
  #list .ltog.leaf{visibility:hidden}
  #list .llbl{font-size:14.5px}
  #list li.collapsed>ul{display:none}
  #list .lcount{color:var(--muted);font-size:12px;margin-left:6px}

  /* clinical image panel */
  #imgpanel{position:fixed;right:16px;bottom:16px;z-index:22;width:210px;background:var(--panel);
            border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 8px 26px rgba(0,0,0,.3);cursor:zoom-in;display:none}
  #imgpanel .imgs{max-height:calc(100vh - 120px);overflow-y:auto;overflow-x:hidden}
  #imgpanel .imgs figure{margin:0 0 8px} #imgpanel .imgs figure:last-child{margin-bottom:0}
  #imgpanel .imgs img{width:100%;display:block;border-radius:7px}
  #imgpanel .imgs figcaption{font-size:10.5px;color:var(--muted);margin-top:4px;line-height:1.3}
  #imgpanel .lbl{position:absolute;top:-9px;left:10px;z-index:1;background:var(--accent);color:var(--on-accent);font-size:10px;font-weight:700;
            padding:1px 7px;border-radius:8px}
  /* enlarged: a lightbox that stays BELOW the top bar, with dimmed backdrop and internal scroll */
  #imgpanel.big{width:min(92vw,660px);left:50%;right:auto;top:calc(var(--bar-h) + 10px);bottom:16px;transform:translateX(-50%);cursor:zoom-out;
            box-shadow:0 0 0 100vmax rgba(0,0,0,.6), 0 12px 40px rgba(0,0,0,.5)}
  #imgpanel.big .imgs{max-height:calc(100vh - 104px)}
  #imgpanel.big .imgs figcaption{font-size:13px}
  .cat .cbody{display:block}
  .cbody-grid{display:flex;flex-direction:column;gap:2px;margin:0 0 5px}
  .subhead{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.2px;margin:6px 4px 2px;opacity:.9}
  /* view toggles (independent hide/show for banner and images) */
  #viewtoggles{position:fixed;left:calc(var(--side) + 14px);bottom:14px;z-index:50;display:flex;gap:6px;transition:left .2s}
  #viewtoggles button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:12px;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.35)}
  #viewtoggles button:hover{border-color:var(--accent)}
  #viewtoggles button.off{opacity:.5}
  body.bar-hidden #bar{display:none}
  body.bar-hidden #sidebar,body.bar-hidden #stage,body.bar-hidden #list{top:0}
  body.bar-hidden #drawerToggle{top:12px}
  body.imgs-off #imgpanel{display:none !important}
</style>
</head>
<body>
<div id="bar">
  <a href="https://mpr455.github.io/CGMHOPH/" title="Main page" style="display:flex;align-items:center;background:#fff;border-radius:6px;padding:2px 7px;text-decoration:none"><img src="logo.svg" alt="CGMH OPH" style="height:24px;width:auto;display:block"></a>
  <span id="crumb"><small>—</small></span>
  <span class="seg"><button id="mList" class="on">List</button><button id="mMap">Map</button></span>
  <button id="expand">Expand all</button>
  <button id="collapse">Collapse all</button>
  <button id="fit">Fit</button>
  <a id="sourcePdf" class="tool-link" target="_blank" rel="noopener">PDF</a>
  <span id="themeDots" class="theme-dots" title="Color theme"></span>
</div>

<div id="sidebar"></div>
<button id="drawerToggle" title="Expand map library" aria-label="Expand map library">▶</button>
<div id="stage"><div id="viewport"><svg id="links"></svg></div></div>
<div id="list"><ul id="listRoot"></ul></div>
<div id="imgpanel"><span class="lbl">Image</span><div class="imgs"></div></div>
<div id="viewtoggles">
  <button id="tgBar" title="Hide / show the top banner">Banner</button>
  <button id="tgImg" title="Hide / show the image panel">Images</button>
</div>

<script>
/* data comes from mindmaps/generated/manifest.json and is lazy-loaded per map */
let CATEGORIES=[]; let MAPS=[];
let CURRENT_MAP_ID=null;
const SOURCE_PDFS_AVAILABLE=!location.hostname.endsWith("github.io");

/* =====================================================================
   VIEWER ENGINE
   ===================================================================== */
const HUES=[205,22,152,275,330,45,190,110,255,0];
let idc=0;
function prep(n,p,hue){ n._id=idc++; n._parent=p; n._hue=hue; (n.children||[]).forEach(c=>prep(c,n,hue)); }

let ROOT=null;
const stage=document.getElementById('stage'), viewport=document.getElementById('viewport'),
      svg=document.getElementById('links'), listPane=document.getElementById('list');
function visKids(n){ return (!n.collapsed && n.children)?n.children:[]; }
function collectVisible(n,a){ a.push(n); visKids(n).forEach(c=>collectVisible(c,a)); return a; }
function subtree(n,a){ a.push(n); visKids(n).forEach(c=>subtree(c,a)); return a; }
function hasKids(n){ return n.children&&n.children.length; }
function escapeHtml(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function displayTitle(s){ return String(s||"").replace(/^\s*(?:\d+(?:\.\d+)+(?:\.)?|\d+\.)\s*/,""); }
function displayNodeLabel(n){ return n.root?displayTitle(n.label):n.label; }
function leafCount(n){ const k=visKids(n); if(!k.length)return 1; return k.reduce((s,c)=>s+leafCount(c),0); }
function eachNode(fn){ (function w(n){ fn(n); (n.children||[]).forEach(w); })(ROOT); }

const P={ row:6, col:250 };

const nodeEls=new Map();
function ensureEls(vis){
  const set=new Set(vis.map(n=>n._id));
  for(const [id,el] of nodeEls){ if(!set.has(id)){ el.remove(); nodeEls.delete(id); } }
  vis.forEach(n=>{
    let el=nodeEls.get(n._id);
    if(!el){ el=document.createElement('div'); el.className='node notrans'; el.dataset.id=n._id; nodeEls.set(n._id,el); viewport.appendChild(el); attachDrag(el,n);
      requestAnimationFrame(()=>el.classList.remove('notrans')); }
    el.className='node'+(n.root?' root':(n._side<0?' side-l':' side-r'));
    if(!n.root){
      if(THEME_DARK){ el.style.background=`hsl(${n._hue},43%,15%)`; el.style.borderColor=`hsl(${n._hue},62%,52%)`; el.style.color=`hsl(${n._hue},64%,91%)`; }
      else { el.style.background=`hsl(${n._hue},70%,95%)`; el.style.borderColor=`hsl(${n._hue},48%,66%)`; el.style.color=`hsl(${n._hue},55%,26%)`; }
    }
    const badge=hasKids(n)?`<span class="badge">${n.collapsed?'+'+n.children.length:'−'}</span>`:'';
    el.innerHTML=`<div class="row"><span class="txt">${escapeHtml(displayNodeLabel(n))}</span>${badge}</div>`;
  });
  vis.forEach(n=>{ const el=nodeEls.get(n._id); n._w=el.offsetWidth; n._h=el.offsetHeight; });
}
function balance(kids){
  const arr=kids.map(k=>({k,w:leafCount(k)})).sort((a,b)=>b.w-a.w);
  let L=0,R=0,left=[],right=[];
  arr.forEach(o=>{ if(R<=L){ right.push(o.k); R+=o.w; } else { left.push(o.k); L+=o.w; } });
  const ix=k=>kids.indexOf(k); right.sort((a,b)=>ix(a)-ix(b)); left.sort((a,b)=>ix(a)-ix(b));
  return {left,right};
}
function tagSide(n,side){ n._side=side; visKids(n).forEach(c=>tagSide(c,side)); }
function layoutSide(branches, sign){
  if(!branches.length) return;
  let y=0; const GAP=P.row;
  function place(n,depth){ n._depth=depth; n._x=sign*depth*P.col;
    const kids=visKids(n);
    if(!kids.length){ n._y=y+n._h/2; y+=n._h+GAP; }
    else{ kids.forEach(c=>place(c,depth+1)); n._y=(kids[0]._y+kids[kids.length-1]._y)/2; } }
  branches.forEach(b=>place(b,1));
  const nodes=[]; branches.forEach(b=>subtree(b,nodes));
  let mn=1e9,mx=-1e9; nodes.forEach(n=>{ mn=Math.min(mn,n._y-n._h/2); mx=Math.max(mx,n._y+n._h/2); });
  const shift=-(mn+mx)/2; nodes.forEach(n=>n._y+=shift);
}
function layout(){
  const vis=collectVisible(ROOT,[]);
  ensureEls(vis);
  const {left,right}=balance(visKids(ROOT));
  right.forEach(b=>tagSide(b,1)); left.forEach(b=>tagSide(b,-1));
  ROOT._x=0; ROOT._y=0; ROOT._depth=0; ROOT._side=0;
  layoutSide(right,1); layoutSide(left,-1);
  draw(vis);
}
function draw(vis){
  let paths='';
  vis.forEach(n=>{ visKids(n).forEach(c=>{
    const dir=(c._x>=n._x)?1:-1;
    const x1=n._x+dir*n._w/2, y1=n._y, x2=c._x-dir*c._w/2, y2=c._y, mx=(x1+x2)/2;
    paths+=`<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" stroke="hsla(${c._hue},60%,58%,.6)"/>`;
  }); });
  svg.innerHTML=paths;
  vis.forEach(n=>{ const el=nodeEls.get(n._id); el.style.left=n._x+'px'; el.style.top=n._y+'px'; });
}

let tx=0,ty=0,scale=1;
function applyView(){ viewport.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`; }
function fit(){
  const vis=collectVisible(ROOT,[]); if(!vis.length)return;
  let a=1e9,b=1e9,c=-1e9,d=-1e9;
  vis.forEach(n=>{ a=Math.min(a,n._x-n._w/2); c=Math.max(c,n._x+n._w/2); b=Math.min(b,n._y-n._h/2); d=Math.max(d,n._y+n._h/2); });
  const pad=70; a-=pad;b-=pad;c+=pad;d+=pad;
  const w=stage.clientWidth, h=stage.clientHeight;
  scale=Math.min(1.1, Math.min(w/(c-a), h/(d-b)));
  tx=(w-(c+a)*scale)/2; ty=(h-(d+b)*scale)/2; applyView();
}

function attachDrag(el,n){
  let sx,sy,moved=false,dragging=false;
  el.addEventListener('pointerdown',e=>{ e.stopPropagation(); dragging=true; moved=false; sx=e.clientX; sy=e.clientY;
    el.classList.add('dragging'); el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove',e=>{ if(!dragging)return;
    if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>4) moved=true;
    const ddx=(e.clientX-sx)/scale, ddy=(e.clientY-sy)/scale; sx=e.clientX; sy=e.clientY;
    subtree(n,[]).forEach(m=>{ m._x+=ddx; m._y+=ddy; }); draw(collectVisible(ROOT,[])); });
  el.addEventListener('pointerup',()=>{ dragging=false; el.classList.remove('dragging');
    if(!moved && hasKids(n)){ n.collapsed=!n.collapsed; onChange(true); } });
}

(function(){
  let panning=false,sx,sy,otx,oty;
  stage.addEventListener('pointerdown',e=>{ if(e.target.closest('.node'))return;
    panning=true; sx=e.clientX; sy=e.clientY; otx=tx; oty=ty; stage.classList.add('panning'); stage.setPointerCapture(e.pointerId); });
  stage.addEventListener('pointermove',e=>{ if(!panning)return; tx=otx+(e.clientX-sx); ty=oty+(e.clientY-sy); applyView(); });
  stage.addEventListener('pointerup',()=>{ panning=false; stage.classList.remove('panning'); });
  stage.addEventListener('wheel',e=>{ e.preventDefault();
    const f=e.deltaY<0?1.12:0.89, ns=Math.max(0.1,Math.min(2.6,scale*f));
    tx=e.clientX-(e.clientX-tx)*(ns/scale); ty=e.clientY-(e.clientY-ty)*(ns/scale); scale=ns; applyView(); },{passive:false});
})();

/* list */
const listRoot=document.getElementById('listRoot');
function setSubtreeCollapsed(n,val){ if(hasKids(n)) n.collapsed=val; (n.children||[]).forEach(c=>setSubtreeCollapsed(c,val)); }
function buildList(){ listRoot.innerHTML=''; if(!ROOT)return; listRoot.appendChild(makeLi(ROOT,0)); }
function makeLi(n,depth){
  const li=document.createElement('li'); li.dataset.d=depth; if(n.collapsed) li.classList.add('collapsed');
  const row=document.createElement('div'); row.className='lrow';
  const tog=document.createElement('span'); tog.className='ltog'+(hasKids(n)?'':' leaf'); tog.textContent=n.collapsed?'+':'−';
  const lbl=document.createElement('span'); lbl.className='llbl';
  lbl.style.fontWeight=depth===0?'700':(depth===1?'650':'400');
  lbl.style.color=depth===0?'var(--accent)':(depth>=3?'var(--muted)':'var(--ink)');
  lbl.textContent=displayNodeLabel(n);
  if(hasKids(n)){ const c=document.createElement('span'); c.className='lcount'; c.textContent='('+n.children.length+')'; lbl.appendChild(c); }
  row.appendChild(tog); row.appendChild(lbl); li.appendChild(row);
  if(hasKids(n)){
    const ul=document.createElement('ul'); n.children.forEach(c=>ul.appendChild(makeLi(c,depth+1))); li.appendChild(ul);
    const toggle=()=>{ setSubtreeCollapsed(n, !n.collapsed); buildList(); };
    tog.onclick=e=>{e.stopPropagation();toggle();}; lbl.onclick=toggle;
  }
  return li;
}

/* mode */
let mode='list';
function onChange(refit){ if(mode==='map'){ layout(); if(refit) fit(); } else buildList(); }
function setMode(m){
  mode=m;
  document.getElementById('mMap').classList.toggle('on',m==='map');
  document.getElementById('mList').classList.toggle('on',m==='list');
  stage.style.display=m==='map'?'block':'none';
  listPane.style.display=m==='list'?'block':'none';
  if(m==='map'){ layout(); fit(); } else buildList();
}
document.getElementById('mMap').onclick=()=>setMode('map');
document.getElementById('mList').onclick=()=>setMode('list');

document.getElementById('expand').onclick=()=>{ eachNode(n=>{ if(!n.root&&hasKids(n)) n.collapsed=false; }); onChange(true); };
document.getElementById('collapse').onclick=()=>{ eachNode(n=>{ if(!n.root&&hasKids(n)) n.collapsed=true; }); onChange(true); };
document.getElementById('fit').onclick=()=>{ if(mode==='map') fit(); };

/* =====================================================================
   SIDEBAR + MAP LOADING
   ===================================================================== */
async function loadMap(map){
  if(!map.data){
    try{ const r=await fetch(map.dataFile||("mindmaps/generated/data/"+map.id+".json"),{cache:"no-store"}); if(!r.ok) throw 0; map.data=await r.json(); }
    catch(err){ document.getElementById("crumb").innerHTML="<small>could not load "+escapeHtml(map.id)+"</small>"; return; }
  }
  if(!map._prepped){
    map.data._parent=null;
    map.data.children.forEach((c,i)=>prep(c,map.data,HUES[i%HUES.length]));
    map.data.collapsed=false;
    (function ic(n){ (n.children||[]).forEach(c=>{ c.collapsed=!!(c.children&&c.children.length); ic(c); }); })(map.data);
    map._prepped=true;
  }
  ROOT=map.data;
  CURRENT_MAP_ID=map.id;
  eachNode(n=>{ n.collapsed=false; });
  nodeEls.forEach(el=>el.remove()); nodeEls.clear(); svg.innerHTML="";
  const sub=map.subcategory?" / "+escapeHtml(map.subcategory):"";
  document.getElementById("crumb").innerHTML=escapeHtml(displayTitle(map.title))+" <small>· "+escapeHtml(map.category)+sub+"</small>";
  const pdfLink=document.getElementById("sourcePdf");
  pdfLink.style.display=(SOURCE_PDFS_AVAILABLE&&map.sourcePdf)?"inline-block":"none"; if(map.sourcePdf) pdfLink.href=map.sourcePdf;
  revealCurrentMap();
  const ip=document.getElementById("imgpanel");
  const imgs=(map.images&&map.images.length)?map.images:(map.image?[{file:map.image,caption:map.imageCaption||""}]:[]);
  if(imgs.length){ ip.querySelector(".lbl").textContent=imgs.length>1?"Images":"Image";
    ip.querySelector(".imgs").innerHTML=imgs.map(im=>"<figure><img src=\""+(im.src||("mindmaps/generated/img/"+im.file))+"\" alt=\"\"><figcaption>"+escapeHtml(im.caption||"")+"</figcaption></figure>").join("");
    ip.style.display="block"; ip.classList.remove("big"); }
  else ip.style.display="none";
  if(mode==="map"){ layout(); fit(); } else buildList();
}
document.getElementById('imgpanel').addEventListener('click',()=>document.getElementById('imgpanel').classList.toggle('big'));
document.getElementById('tgBar').onclick=e=>{ document.body.classList.toggle('bar-hidden'); e.currentTarget.classList.toggle('off'); syncChrome(); };
document.getElementById('tgImg').onclick=e=>{ document.body.classList.toggle('imgs-off'); e.currentTarget.classList.toggle('off'); };

function buildSidebar(){
  const sb=document.getElementById("sidebar"); sb.innerHTML="";
  const searchWrap=document.createElement("div"); searchWrap.className="toolbox-search-wrap";
  const search=document.createElement("input"); search.id="toolboxSearch"; search.className="toolbox-search"; search.type="search";
  search.placeholder="Search mind maps..."; search.setAttribute("aria-label","Search mind maps");
  const clear=document.createElement("button"); clear.className="toolbox-search-clear"; clear.type="button"; clear.textContent="Clear";
  clear.title="Clear search"; clear.onclick=()=>clearToolboxSearch();
  search.oninput=()=>filterToolbox(search.value);
  searchWrap.appendChild(search); searchWrap.appendChild(clear); sb.appendChild(searchWrap);
  const noResults=document.createElement("div"); noResults.id="toolboxNoResults"; noResults.className="toolbox-no-results";
  noResults.textContent="No mind maps match that search."; sb.appendChild(noResults);
  CATEGORIES.forEach(cat=>{
    const maps=MAPS.filter(m=>m.category===cat);
    const wrap=document.createElement("div"); wrap.className="cat collapsed"; wrap.dataset.search=cat.toLowerCase();
    const head=document.createElement("div"); head.className="chead";
    head.innerHTML="<span class=\"car\">▾</span><span>"+escapeHtml(cat)+"</span><span class=\"cn\">"+maps.length+"</span>";
    head.onclick=()=>wrap.classList.toggle("collapsed");
    const body=document.createElement("div"); body.className="cbody";
    if(maps.length){
      const subs=[]; maps.forEach(m=>{ const s=m.subcategory||""; if(!subs.includes(s)) subs.push(s); });
      subs.forEach(sub=>{
        if(sub){ const sh=document.createElement("div"); sh.className="subhead"; sh.textContent=sub; body.appendChild(sh); }
        const grid=document.createElement("div"); grid.className="cbody-grid";
        maps.filter(m=>(m.subcategory||"")===sub).forEach(m=>{
          const btn=document.createElement("button"); btn.className="mapbtn"; btn.dataset.id=m.id; btn.title=displayTitle(m.title);
          btn.dataset.search=[displayTitle(m.title),m.title,m.category,m.subcategory||""].join(" ").toLowerCase();
          btn.innerHTML="<b>"+escapeHtml(displayTitle(m.title))+"</b>";
          btn.onclick=()=>{ CURRENT_MAP_ID=m.id; clearToolboxSearch(); setToolboxExpanded(false); loadMap(m); };
          grid.appendChild(btn);
        });
        body.appendChild(grid);
      });
    } else { const em=document.createElement("div"); em.className="empty"; em.textContent="no maps yet"; body.appendChild(em); }
    wrap.appendChild(head); wrap.appendChild(body); sb.appendChild(wrap);
  });
  revealCurrentMap({scroll:false});
}

function clearToolboxSearch(){
  const search=document.getElementById('toolboxSearch');
  if(!search) return;
  search.value=''; filterToolbox('');
}

function filterToolbox(value){
  const q=String(value||'').trim().toLowerCase();
  const wrap=document.querySelector('#sidebar .toolbox-search-wrap');
  if(wrap) wrap.classList.toggle('has-query',!!q);
  let matches=0;
  document.querySelectorAll('#sidebar .cat').forEach(cat=>{
    const categoryMatch=!!q && (cat.dataset.search||'').includes(q);
    let catMatches=0;
    cat.querySelectorAll('.cbody-grid').forEach(grid=>{
      let gridMatches=0;
      grid.querySelectorAll('.mapbtn').forEach(btn=>{
        const hit=!q || categoryMatch || (btn.dataset.search||'').includes(q);
        btn.hidden=!hit;
        if(hit){ gridMatches++; catMatches++; matches++; }
      });
      grid.hidden=gridMatches===0;
      const subhead=grid.previousElementSibling;
      if(subhead&&subhead.classList.contains('subhead')) subhead.hidden=gridMatches===0;
    });
    cat.hidden=!!q&&catMatches===0;
    if(q&&catMatches) cat.classList.remove('collapsed');
    else if(!q) cat.classList.toggle('collapsed',!document.body.classList.contains('toolbox-expanded')&&!cat.classList.contains('current-cat'));
  });
  const empty=document.getElementById('toolboxNoResults');
  if(empty) empty.style.display=(q&&matches===0)?'block':'none';
}

function revealCurrentMap(options){
  options=options||{};
  let active=null;
  document.querySelectorAll('#sidebar .mapbtn').forEach(btn=>{
    const current=!!CURRENT_MAP_ID&&btn.dataset.id===CURRENT_MAP_ID;
    btn.classList.toggle('active',current);
    if(current){ btn.setAttribute('aria-current','page'); active=btn; }
    else btn.removeAttribute('aria-current');
  });
  document.querySelectorAll('#sidebar .cat').forEach(cat=>cat.classList.toggle('current-cat',!!active&&cat.contains(active)));
  if(!active) return;
  const currentCat=active.closest('.cat');
  if(currentCat) currentCat.classList.remove('collapsed');
  if(options.scroll===false) return;
  setTimeout(()=>active.scrollIntoView({block:document.body.classList.contains('toolbox-expanded')?'center':'nearest',behavior:'smooth'}),30);
}

const drawerToggle=document.getElementById('drawerToggle');
function setToolboxExpanded(expanded){
  document.body.classList.toggle('toolbox-expanded',expanded);
  revealCurrentMap({scroll:false});
  document.querySelectorAll('#sidebar .cat').forEach(cat=>cat.classList.toggle('collapsed',!expanded&&!cat.classList.contains('current-cat')));
  drawerToggle.textContent=expanded?'◀':'▶';
  drawerToggle.title=expanded?'Return to compact map library':'Expand map library';
  drawerToggle.setAttribute('aria-label',drawerToggle.title);
  const search=document.getElementById('toolboxSearch');
  if(search&&search.value.trim()) filterToolbox(search.value);
  revealCurrentMap();
  if(!expanded&&mode==='map') setTimeout(fit,240);
}
drawerToggle.onclick=()=>setToolboxExpanded(!document.body.classList.contains('toolbox-expanded'));

function syncChrome(){
  const h=document.body.classList.contains('bar-hidden')?0:Math.ceil(document.getElementById('bar').getBoundingClientRect().height);
  document.documentElement.style.setProperty('--bar-h',h+'px');
  if(mode==='map') fit();
}
new ResizeObserver(syncChrome).observe(document.getElementById('bar'));
window.addEventListener('resize',syncChrome);

/* =====================================================================
   THEMES  (accent + backgrounds; node chips keep their category hues)
   ===================================================================== */
// palettes matched to CGMH OPH note assistant (--acc → accent, --card → panel, --sub → muted)
const THEMES={
  "CGMH Blue":{ bg:"#f4f6f9", ink:"#1c2733", muted:"#5b6b7c", line:"#dde4ec", panel:"#ffffff", accent:"#0f6bb2", accent2:"#0a4f86", dark:false },
  "Macaroon": { bg:"#faf3e9", ink:"#3d3128", muted:"#927f6e", line:"#ecdcc7", panel:"#fffdf8", accent:"#e0873a", accent2:"#c26a1e", dark:false },
  "Dark":     { bg:"#0f1720", ink:"#e6edf3", muted:"#a8bccc", line:"#2c3d4d", panel:"#1a2632", accent:"#4db1ea", accent2:"#7fc4f0", dark:true },
  "Black":    { bg:"#000000", ink:"#f5f5f5", muted:"#b7b39a", line:"#2a2a2a", panel:"#0b0b0b", accent:"#ffd23f", accent2:"#e0b400", dark:true }
};
let THEME_DARK=false;
function lum(hex){ const n=parseInt(hex.slice(1),16), r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255;
  const f=c=>c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4); return .2126*f(r)+.7152*f(g)+.0722*f(b); }
function applyTheme(name){
  const t=THEMES[name]||THEMES["CGMH Blue"]; const r=document.documentElement.style;
  r.setProperty('--bg',t.bg); r.setProperty('--ink',t.ink); r.setProperty('--muted',t.muted);
  r.setProperty('--line',t.line); r.setProperty('--panel',t.panel); r.setProperty('--accent',t.accent);
  r.setProperty('--on-accent', lum(t.accent)>0.55 ? '#10203a' : '#ffffff');  // readable text on accent
  document.body.style.background=t.bg;
  THEME_DARK=!!t.dark;
  document.querySelectorAll('.tdot').forEach(d=>d.classList.toggle('sel',d.dataset.name===name));
  try{ localStorage.setItem('oph_theme',name); }catch(e){}
  if(ROOT){ if(mode==='map'){ layout(); } else buildList(); }
}
(function(){
  const wrap=document.getElementById('themeDots');
  Object.entries(THEMES).forEach(([k,t])=>{
    const d=document.createElement('span'); d.className='tdot'; d.dataset.name=k; d.title=k;
    d.style.background=t.accent; d.style.boxShadow=`inset 0 0 0 6px ${t.bg}`;
    d.onclick=()=>applyTheme(k); wrap.appendChild(d);
  });
  let saved="CGMH Blue"; try{ saved=localStorage.getItem('oph_theme')||"CGMH Blue"; }catch(e){}
  if(!THEMES[saved]) saved="CGMH Blue";
  applyTheme(saved);
})();

/* init */
async function init(){
  try{
    const r=await fetch("mindmaps/generated/manifest.json",{cache:"no-store"}); if(!r.ok) throw 0;
    const mani=await r.json(); CATEGORIES=mani.categories; MAPS=mani.maps;
  }catch(e){
    document.getElementById("list").style.display="block";
    document.getElementById("list").innerHTML="<div style=\"max-width:640px;margin:70px auto;color:var(--muted);font-size:15px;line-height:1.6\">Couldn’t load <code>mindmaps/generated/manifest.json</code>.<br>Run <code>python tools/mindmap_converter.py</code>, then open this page via your GitHub Pages URL or a local web server (not by double-clicking the file).</div>";
    return;
  }
  buildSidebar(); syncChrome(); setMode("list"); setToolboxExpanded(true);
}
init();
